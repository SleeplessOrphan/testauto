name: ci
run-name: ci ${{ inputs.branch || github.ref_name }}
# The neutral referee. Runs on every push to main and to your own branches (so your pull requests get
# their checks), and is started by the pipeline on agent branches (task/* and revert/*). Every job name
# below is a required status check on main.
# There is deliberately no pull_request trigger: GitHub holds pull_request runs on PRs the pipeline opens
# until a maintainer approves them, and a held run blocks the merge even when every check is green.
on:
  push:
    branches-ignore: ["task/**", "revert/**"]
  workflow_dispatch:
    inputs:
      issue:
        description: Task issue number (set by the pipeline)
        required: false
        default: ""
      branch:
        description: Agent branch to test (set by the pipeline). The workflow itself always runs from main.
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: ci-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  BRANCH: ${{ inputs.branch || github.ref_name }}

jobs:
  # The commit under test. The pipeline starts this workflow on main (so it always uses main's settings and
  # permissions) and names the agent branch in `branch`; every job tests that branch's commit.
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [[ -n $INPUT_BRANCH ]]; then sha=$(gh api "repos/$GH_REPO/commits/$INPUT_BRANCH" --jq .sha); else sha=$GITHUB_SHA; fi
          echo "Testing $BRANCH at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.head.outputs.sha }}", persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx next build

  unit:
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.head.outputs.sha }}", persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npx vitest run
      - name: Require the test log
        if: always()
        run: test -s junit/unit.xml || { echo "::error::No unit test log was written"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: junit/
          retention-days: 30

  e2e:
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.head.outputs.sha }}", persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: ./.github/actions/setup-playwright
      - run: npx next build
      - name: End-to-end tests (Playwright)
        run: npx playwright test --project=e2e
        env: { CI: "true" }
      - name: Require the test log
        if: always()
        run: test -s junit/playwright.xml || { echo "::error::No Playwright test log was written"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: junit/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore

  docs-check:
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.head.outputs.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Use the guard scripts from main (agents can't change them on their branch)
        run: |
          git fetch -q origin main
          mkdir -p "$RUNNER_TEMP/kit"
          if git cat-file -e origin/main:scripts/guards/docs-check.sh 2>/dev/null; then
            git archive origin/main scripts models.yaml prompts | tar -x -C "$RUNNER_TEMP/kit"
          else
            cp -r scripts models.yaml prompts "$RUNNER_TEMP/kit/"
          fi
          echo "BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: Run guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/kit/scripts/guards/${{ github.job }}.sh" "$BASE" "$BRANCH"

  size-check:
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.head.outputs.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Use the guard scripts from main (agents can't change them on their branch)
        run: |
          git fetch -q origin main
          mkdir -p "$RUNNER_TEMP/kit"
          if git cat-file -e origin/main:scripts/guards/docs-check.sh 2>/dev/null; then
            git archive origin/main scripts models.yaml prompts | tar -x -C "$RUNNER_TEMP/kit"
          else
            cp -r scripts models.yaml prompts "$RUNNER_TEMP/kit/"
          fi
          echo "BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: Run guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/kit/scripts/guards/${{ github.job }}.sh" "$BASE" "$BRANCH"

  protected-files:
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.head.outputs.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Use the guard scripts from main (agents can't change them on their branch)
        run: |
          git fetch -q origin main
          mkdir -p "$RUNNER_TEMP/kit"
          if git cat-file -e origin/main:scripts/guards/docs-check.sh 2>/dev/null; then
            git archive origin/main scripts models.yaml prompts | tar -x -C "$RUNNER_TEMP/kit"
          else
            cp -r scripts models.yaml prompts "$RUNNER_TEMP/kit/"
          fi
          echo "BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: Run guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/kit/scripts/guards/${{ github.job }}.sh" "$BASE" "$BRANCH"

  # Not a required check: hands the result to the next stage of the pipeline.
  pipeline-next:
    needs: [head, build, unit, e2e, docs-check, size-check, protected-files]
    # Only this shell job may post commit statuses (the check results).
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      statuses: write
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (startsWith(inputs.branch, 'task/') || startsWith(inputs.branch, 'revert/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue }}
      SHA: ${{ needs.head.outputs.sha }}
      RESULTS: ${{ toJSON(needs) }}
      LOGS: ${{ github.workspace }}/logs
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: junit-*
          path: logs
      - run: bash scripts/pipeline/after-ci.sh
