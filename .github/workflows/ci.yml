name: ci
run-name: ci ${{ github.ref_name }}
# The neutral referee. Runs on your own pull requests and on main, and is started by the pipeline on agent
# branches (task/* and revert/*). Every job name below is a required status check on main.
# GitHub also fires pull_request runs for agent PRs and holds them for approval. They are not
# needed (the pipeline starts its own runs), so if someone approves one, every job skips.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: Task issue number (set by the pipeline)
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'task/') || startsWith(github.head_ref, 'revert/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx next build

  unit:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'task/') || startsWith(github.head_ref, 'revert/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npx vitest run
      - name: Require the test log
        if: always()
        run: test -s junit/unit.xml || { echo "::error::No unit test log was written"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: junit/
          retention-days: 30

  e2e:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'task/') || startsWith(github.head_ref, 'revert/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: ./.github/actions/setup-playwright
      - run: npx next build
      - name: End-to-end tests (Playwright)
        run: npx playwright test --project=e2e
        env: { CI: "true" }
      - name: Require the test log
        if: always()
        run: test -s junit/playwright.xml || { echo "::error::No Playwright test log was written"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: junit/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore

  docs-check:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'task/') || startsWith(github.head_ref, 'revert/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Use the guard scripts from main (agents can't change them on their branch)
        run: |
          git fetch -q origin main
          mkdir -p "$RUNNER_TEMP/kit"
          if git cat-file -e origin/main:scripts/guards/docs-check.sh 2>/dev/null; then
            git archive origin/main scripts models.yaml prompts | tar -x -C "$RUNNER_TEMP/kit"
          else
            cp -r scripts models.yaml prompts "$RUNNER_TEMP/kit/"
          fi
          echo "BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: Run guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/kit/scripts/guards/${{ github.job }}.sh" "$BASE" "$BRANCH"

  size-check:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'task/') || startsWith(github.head_ref, 'revert/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Use the guard scripts from main (agents can't change them on their branch)
        run: |
          git fetch -q origin main
          mkdir -p "$RUNNER_TEMP/kit"
          if git cat-file -e origin/main:scripts/guards/docs-check.sh 2>/dev/null; then
            git archive origin/main scripts models.yaml prompts | tar -x -C "$RUNNER_TEMP/kit"
          else
            cp -r scripts models.yaml prompts "$RUNNER_TEMP/kit/"
          fi
          echo "BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: Run guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/kit/scripts/guards/${{ github.job }}.sh" "$BASE" "$BRANCH"

  protected-files:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'task/') || startsWith(github.head_ref, 'revert/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Use the guard scripts from main (agents can't change them on their branch)
        run: |
          git fetch -q origin main
          mkdir -p "$RUNNER_TEMP/kit"
          if git cat-file -e origin/main:scripts/guards/docs-check.sh 2>/dev/null; then
            git archive origin/main scripts models.yaml prompts | tar -x -C "$RUNNER_TEMP/kit"
          else
            cp -r scripts models.yaml prompts "$RUNNER_TEMP/kit/"
          fi
          echo "BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: Run guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/kit/scripts/guards/${{ github.job }}.sh" "$BASE" "$BRANCH"

  # Not a required check: hands the result to the next stage of the pipeline.
  pipeline-next:
    needs: [build, unit, e2e, docs-check, size-check, protected-files]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (startsWith(github.ref_name, 'task/') || startsWith(github.ref_name, 'revert/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue }}
      RESULTS: ${{ toJSON(needs) }}
      LOGS: ${{ github.workspace }}/logs
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: junit-*
          path: logs
      - run: bash scripts/pipeline/after-ci.sh
