name: adversary-review
run-name: "adversary-review ${{ github.ref_name }} #${{ inputs.issue }}"
# Stage 4 of a task: the adversary attacks the finished change. Its verdict is the required
# `adversary-verdict` check. On approval this workflow merges the PR and starts the staging deploy.
on:
  workflow_dispatch:
    inputs:
      issue: { description: Task issue number, required: false, default: "" }
      pr: { description: Pull request number, required: false, default: "" }
  # Pushes to your own branches: the check passes so your pull requests can merge. No pull_request
  # trigger, because GitHub holds those runs on the pipeline's PRs and a held run blocks the merge.
  push:
    branches-ignore: [main, "task/**", "revert/**"]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  adversary-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.owner.outputs.verdict || steps.revert.outputs.verdict || steps.finish.outputs.verdict }}
      reason: ${{ steps.finish.outputs.reason }}
    env:
      ISSUE: ${{ inputs.issue }}
      PR: ${{ inputs.pr }}
    steps:
      # Your own pull requests are not reviewed by the adversary; the check passes so you can merge them.
      - id: owner
        if: github.event_name == 'push'
        run: |
          if [[ "${{ github.actor }}" == "${{ github.repository_owner }}" ]]; then
            echo "Pushed by the repository owner: no adversary review needed."
            echo "verdict=approve" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Only the repository owner's branches skip the adversary."
            echo "verdict=reject" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Copy the pipeline kit from main, out of the agent's reach
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch -q origin main
          mkdir -p "$RUNNER_TEMP/kit"
          git archive origin/main scripts models.yaml prompts | tar -x -C "$RUNNER_TEMP/kit"

      # Automatic reverts are checked mechanically: the PR must be exactly `git revert` of one commit.
      - id: revert
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'revert/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash "$RUNNER_TEMP/kit/scripts/pipeline/verify-revert.sh"

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'task/')
        with: { node-version: 22, cache: npm }
      - name: Install packages
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'task/')
        run: npm ci
      - uses: ./.github/actions/setup-playwright
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'task/')
      - name: Start the app
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'task/')
        run: |
          npx next build
          nohup npx next start -p 3000 > "$RUNNER_TEMP/app.log" 2>&1 &
          npx --yes wait-on@8 -t 60000 http://localhost:3000
      - id: prep
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'task/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash "$RUNNER_TEMP/kit/scripts/pipeline/agent.sh" review prepare
      - id: claude
        if: steps.prep.outcome == 'success' && steps.prep.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: "*"
          prompt: |
            Your instructions are in .pipeline/instructions.md, the task is in .pipeline/task.md and the change is in .pipeline/diff.patch.
            The task number N is ${{ inputs.issue }}. Follow the instructions exactly and finish by writing .pipeline/verdict.json.
          claude_args: >-
            --model ${{ steps.prep.outputs.model }}
            --max-turns ${{ steps.prep.outputs.max_turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npx tsc:*),Bash(npx vitest run:*),Bash(npx playwright test:*)"
      - id: finish
        name: Record the verdict
        if: steps.prep.outcome == 'success' && steps.prep.outputs.skip != 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ steps.prep.outputs.model }}
        run: bash "$RUNNER_TEMP/kit/scripts/pipeline/agent.sh" review finish "${{ steps.claude.outputs.execution_file }}"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: adversary-review-log
          path: |
            .pipeline/
            playwright-report/
            test-results/
            ${{ steps.claude.outputs.execution_file }}
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Enforce the verdict
        if: always()
        run: |
          v="${{ steps.owner.outputs.verdict || steps.revert.outputs.verdict || steps.finish.outputs.verdict }}"
          echo "Verdict: ${v:-none}"
          [[ "$v" == approve ]] || { echo "::error::The adversary did not approve this change."; exit 1; }

  # Not a required check: merges on approval, or sends the task back to the coder.
  pipeline-next:
    needs: adversary-verdict
    if: always() && github.event_name == 'workflow_dispatch'
    # Only this shell job may post commit statuses (the adversary-verdict status); the agent's job can't.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue }}
      PR: ${{ inputs.pr }}
      BRANCH: ${{ github.ref_name }}
      VERDICT: ${{ needs.adversary-verdict.outputs.verdict }}
      REASON: ${{ needs.adversary-verdict.outputs.reason }}
      JOB_RESULT: ${{ needs.adversary-verdict.result }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, persist-credentials: false }
      - run: bash scripts/pipeline/after-review.sh
