name: coder
on:
  issues:
    types: [labeled]
jobs:
  code:
    if: github.event.label.name == 'task'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Implement issue #${{ github.event.issue.number }}. Keep the change under 300 lines,
            update docs/ and CHANGELOG.md, and open a pull request that links the issue.
          claude_args: --model claude-sonnet-5-5 --max-turns 30
