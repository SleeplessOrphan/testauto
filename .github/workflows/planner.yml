name: planner
run-name: planner
# Turns spec/app.md into queued task issues when the spec changes on main. Run it by hand from the
# Actions tab (planner -> Run workflow) to finish a failed run: it reuses the saved plan.
# claude-code-action can't run on push events, so a push only starts a workflow_dispatch run of this
# same workflow, and the planning happens in that run.
on:
  push:
    branches: [main]
    paths: ["spec/**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write
  id-token: write

concurrency:
  group: planner
  cancel-in-progress: false

jobs:
  start:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh workflow run planner.yml --ref "${{ github.ref_name }}"

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy the pipeline kit out of the workspace
        run: mkdir -p "$RUNNER_TEMP/kit" && cp -r scripts prompts models.yaml "$RUNNER_TEMP/kit/"
      - id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_KEY_SET: ${{ secrets.OPENAI_API_KEY != '' }}
          GOOGLE_KEY_SET: ${{ secrets.GOOGLE_API_KEY != '' }}
        run: bash "$RUNNER_TEMP/kit/scripts/pipeline/plan.sh" prepare
      - id: claude
        if: steps.prep.outputs.skip != 'true' && steps.prep.outputs.reuse != 'true' && steps.prep.outputs.provider == 'anthropic'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: "*"
          prompt: |
            Your instructions are in .pipeline/instructions.md. Follow them exactly.
          claude_args: >-
            --model ${{ steps.prep.outputs.model }}
            --max-turns ${{ steps.prep.outputs.max_turns }}
            --allowedTools "Read,Glob,Grep,Write"
      # OpenAI and Google roles run their own coding CLI instead (see docs/providers.md). Only the key for
      # the role's provider is passed in, and never the GitHub token.
      - id: other
        if: steps.prep.outputs.skip != 'true' && steps.prep.outputs.reuse != 'true' && steps.prep.outputs.provider != 'anthropic'
        env:
          PROVIDER: ${{ steps.prep.outputs.provider }}
          MODEL: ${{ steps.prep.outputs.model }}
          EFFORT: ${{ steps.prep.outputs.effort }}
          MAX_TURNS: ${{ steps.prep.outputs.max_turns }}
          AGENT_MINUTES: "20"
          ALLOWED: "none (only read files and write .pipeline/plan.json)"
          CODEX_API_KEY: ${{ steps.prep.outputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ steps.prep.outputs.provider == 'google' && secrets.GOOGLE_API_KEY || '' }}
        run: |
          bash "$RUNNER_TEMP/kit/scripts/pipeline/run-agent.sh" "Your instructions are in .pipeline/instructions.md. Follow them exactly."
      - name: Copy the pipeline kit again, in case the agent changed it
        if: steps.other.outcome != 'skipped' && !cancelled()
        run: |
          rm -rf "$RUNNER_TEMP/kit" && mkdir -p "$RUNNER_TEMP/kit"
          git -c core.hooksPath=/dev/null fetch -q "https://github.com/${{ github.repository }}" "${{ github.ref_name }}"
          git archive FETCH_HEAD scripts models.yaml prompts | tar -x -C "$RUNNER_TEMP/kit"
      - name: Create the task issues
        if: steps.prep.outputs.skip != 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.prep.outputs.hash }}
          REUSE: ${{ steps.prep.outputs.reuse }}
        run: bash "$RUNNER_TEMP/kit/scripts/pipeline/plan.sh" publish "${{ steps.claude.outputs.execution_file || steps.other.outputs.execution_file }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-log
          path: |
            .pipeline/
            ${{ steps.claude.outputs.execution_file }}
            ${{ runner.temp }}/agent-run/
          if-no-files-found: ignore
