# Which model each agent role uses, plus the limits the pipeline enforces.
# Changing a model is a one-line edit here. Agents cannot change this file:
# the protected-files check refuses any task PR that touches it.
#
# `provider` picks the company and its coding tool (see docs/providers.md):
#   anthropic  Claude Code (anthropics/claude-code-action), key secret ANTHROPIC_API_KEY
#   openai     OpenAI Codex CLI,                             key secret OPENAI_API_KEY
#   google     Gemini CLI,                                   key secret GOOGLE_API_KEY
# Every role below is Anthropic, so nothing changes until you switch one. A role on
# openai or google needs its model listed under `prices`, or the task stalls instead
# of running with spend it can't count. `effort` works for anthropic and openai only.
#
# Example: put the reviewer on another company's model for an independent check:
#   adversary_review: { provider: openai, model: gpt-6.2-sol,    max_turns: 40, effort: medium }
#   adversary_review: { provider: google, model: gemini-4-neon,  max_turns: 40 }

#
# `effort` (optional: low, medium, high, xhigh, max) is how hard the model thinks. Lower effort means fewer
# tokens. Sonnet's default is high; medium is the suggested level for coding agents. Leave it out to use the
# model's default.

roles:
  planner:          { provider: anthropic, model: claude-opus-5-5,   max_turns: 30 }
  adversary_tests:  { provider: anthropic, model: claude-sonnet-5-5, max_turns: 40, effort: medium }
  coder:            { provider: anthropic, model: claude-sonnet-5-5, max_turns: 40, effort: medium }
  coder_escalation: { provider: anthropic, model: claude-opus-5-5,   max_turns: 40 }
  adversary_review: { provider: anthropic, model: claude-sonnet-5-5, max_turns: 40, effort: medium }

limits:
  per_task_usd: 1.5        # a task that has spent this much is stalled and flagged
  monthly_usd: 45          # no new task starts once this month's recorded spend reaches this (0 = no limit)
  max_rounds: 3            # coder rounds on the normal model; one more round on the escalation model, then stall
  max_changed_lines: 300   # size-check, not counting tests/ and package-lock.json
  max_changed_files: 10

# Prices for OpenAI and Google models, in US dollars per million tokens:
# [input, cached input, output]. Claude reports its own cost, so Anthropic models
# aren't listed. Checked 28 Nov 2026: OpenAI's GPT-6.2 prices match OpenAI's own
# pricing page; OpenAI has nothing newer than GPT-6.2. Google's pricing page doesn't
# list Gemini 4 yet, so the Gemini 4 prices come from third-party lists, with
# cached input assumed at a tenth of input (Google's usual ratio). Providers change
# prices, so check the provider's pricing page before relying on one. Where a price
# is about to rise, or sources differ, the higher price is used.
prices:
  gpt-6.2-astra:          [8, 0.40, 40]       # OpenAI flagship
  gpt-6.2-sol:            [2, 0.10, 10]       # OpenAI mid-price, a good reviewer
  gpt-6-luna:             [0.10, 0.01, 0.50]  # OpenAI cheapest
  gemini-4-neon:          [3, 0.30, 15]       # Google's newest, released 18 Nov 2026
  gemini-4-hydrogen:      [1.50, 0.15, 7.50]  # Google, released 12 Nov 2026
  gemini-4-carbon:        [4, 0.40, 20]       # Google ($2/$10 until 30 Nov 2026)
  gemini-4-argon:         [4, 0.20, 20]       # Google flagship ($2/$10 until 30 Nov 2026)
  gemini-3.1-pro-preview: [2, 0.20, 12]       # prompts under 200k tokens
  gemini-3.8-flash:       [1.50, 0.15, 7.50]  # Google fast ($0.75/$3.75 until 31 Dec 2026)
  gemini-3.5-flash-lite:  [0.30, 0.03, 2.50]  # Google cheapest

# The watchdog stalls a task that sits in one stage longer than this with no run going.
stage_minutes:
  tests: 40
  code: 60
  ci: 40
  review: 45
  staging: 30
